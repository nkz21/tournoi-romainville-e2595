<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion · Tournoi Romainville</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #3a35d4 0%, #05071e 45%, #000 100%);
      color: #f5f7ff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(5,7,30,.92);
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 20px 60px rgba(0,0,0,.7);
      padding: 26px 24px 22px;
    }
    .brand {
      display: flex; align-items: center; gap: 10px; margin-bottom: 18px;
      font-size: 13px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
    }
    .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: #7f5cff; box-shadow: 0 0 10px #7f5cff; }
    h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 6px;
    }
    p.sub {
      font-size: 13px;
      color: rgba(255,255,255,.55);
      margin-bottom: 22px;
    }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .field label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: rgba(255,255,255,.45);
    }
    .field input {
      width: 100%; padding: 12px 14px;
      border-radius: 12px; border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.06); color: #f5f7ff;
      font-size: 14px; font-family: inherit; outline: none;
      transition: border-color .2s, background .2s;
    }
    .field input:focus {
      border-color: rgba(173,153,255,.7);
      background: rgba(255,255,255,.1);
    }
    .btn-main {
      width: 100%;
      margin-top: 8px;
      border-radius: 14px;
      border: 1px solid rgba(127,92,255,.7);
      background: linear-gradient(135deg, #7f5cff, #e652ff);
      color: #fff;
      font-family: 'Oswald', sans-serif;
      font-size: 1rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      padding: 12px 16px;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s, filter .15s;
    }
    .btn-main:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 30px rgba(0,0,0,.6);
      filter: brightness(1.03);
    }
    .info {
      margin-top: 14px;
      font-size: 12px;
      color: rgba(255,255,255,.55);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .info a {
      color: #b8a4ff;
      text-decoration: none;
      font-weight: 600;
      font-size: 12px;
    }
    .err {
      font-size: 12px;
      color: #ff7c98;
      min-height: 16px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-dot"></div>
      Tournoi Romainville
    </div>
    <h1>Accès admin</h1>
    <p class="sub">Connecte-toi pour gérer les scores, statuts et buteurs du tournoi.</p>

    <div class="field">
      <label for="inp-pass">Mot de passe</label>
      <input type="password" id="inp-pass" placeholder="••••••••" />
    </div>
    <button class="btn-main" id="btn-login">Se connecter</button>
    <div class="err" id="err"></div>

    <div class="info">
      <span>Tu n'es pas arbitre&nbsp;? Pas de souci.</span>
      <a href="index.html">← Retour au site public</a>
    </div>
  </div>

  <script>
    const ADMIN_PASS = 'romainville2024'; // change ce mot de passe

    document.getElementById('btn-login').addEventListener('click', () => {
      const pass = document.getElementById('inp-pass').value.trim();
      const err = document.getElementById('err');

      if (pass === '') {
        err.textContent = 'Merci de saisir le mot de passe.';
        return;
      }
      if (pass !== ADMIN_PASS) {
        err.textContent = 'Mot de passe incorrect.';
        return;
      }

      sessionStorage.setItem('tr_admin', '1');
      window.location.href = 'admin.html';
    });

    document.getElementById('inp-pass').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        document.getElementById('btn-login').click();
      }
    });
  </script>
</body>
</html>
